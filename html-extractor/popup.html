<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML &amp; Content Extractor Pro</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            width: 340px;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        h2 {
            font-size: 16px; margin: 0; font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .badge {
            font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
            background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .subtitle { font-size: 12px; color: #94a3b8; margin: 0 0 14px 0; line-height: 1.4; }
        label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 6px; }
        select {
            width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: #f8fafc; font-size: 13px; margin-bottom: 12px; outline: none; cursor: pointer;
        }
        select:focus { border-color: #38bdf8; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        button {
            border: none; border-radius: 8px; color: #ffffff; padding: 10px 12px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease;
        }
        button:hover { opacity: 0.92; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #6366f1); }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-picker { width: 100%; background: linear-gradient(135deg, #10b981, #059669); margin-bottom: 10px; }
        .stats {
            display: none; justify-content: space-between; font-size: 11px; color: #94a3b8;
            background: rgba(15, 23, 42, 0.7); border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; margin-bottom: 8px;
        }
        .preview {
            display: none; width: 100%; height: 90px; background: #0b1120; border: 1px solid #334155;
            border-radius: 6px; color: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px; padding: 8px; resize: none; margin-bottom: 8px;
        }
        .status { font-size: 12px; min-height: 16px; text-align: center; color: #38bdf8; }
        .status.error { color: #f87171; }
        .status.success { color: #34d399; }
        .footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid #1e293b; font-size: 10px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h2>HTML Extractor Pro</h2>
        <span class="badge">v2.0</span>
    </div>
    <p class="subtitle">Extract full DOM, clean HTML, AI-ready Markdown, JSON metadata, or pick element selectors.</p>
    <label for="modeSelect">Extraction Format</label>
    <select id="modeSelect">
        <option value="full-dom">Full DOM HTML (Shadow DOM + Inputs + Iframes)</option>
        <option value="clean-html">Sanitized Clean HTML (DOMPurify)</option>
        <option value="markdown">Article Markdown (Readability + Turndown)</option>
        <option value="json-meta">Page Metadata &amp; Structure (JSON)</option>
    </select>
    <div class="btn-row">
        <button id="downloadBtn" class="btn-primary">Download</button>
        <button id="copyBtn" class="btn-secondary">Copy</button>
    </div>
    <button id="pickerBtn" class="btn-picker">Pick Element Selector (CSS + XPath)</button>
    <div id="stats" class="stats"><span id="statSize">0 KB</span><span id="statInfo">Ready</span></div>
    <textarea id="preview" class="preview" readonly></textarea>
    <div id="status" class="status"></div>
    <div class="footer">Powered by Mozilla Readability &bull; Turndown &bull; DOMPurify</div>
    <script src="lib/purify.min.js"></script>
    <script src="lib/turndown.js"></script>
    <script src="popup.js"></script>
</body>
</html>
